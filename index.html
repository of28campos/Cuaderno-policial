<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Registro Operativo</title>
    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background-color: #0d0d12; color: #fff; margin: 0; padding: 20px; }
        h2 { margin-top: 0; color: #fff; font-size: 18px; text-transform: uppercase; letter-spacing: 1px; }
        
        input, select, button, textarea { width: 100%; padding: 14px; margin-bottom: 15px; border-radius: 8px; border: 1px solid #2c2c2e; font-size: 15px; box-sizing: border-box; background-color: #151518; color: #fff; }
        input:focus, textarea:focus { outline: none; border-color: #d4a373; }
        input[type="date"] { color: #fff; }
        
        button { background-color: #d4a373; color: #000; font-weight: bold; cursor: pointer; border: none; font-size: 16px; margin-top: 10px; }
        button.secondary { background-color: #2c2c2e; color: #fff; }
        button.add-btn { background-color: #2c2c2e; color: #d4a373; border: 1px dashed #d4a373; margin-top: 5px; margin-bottom: 15px; }
        
        .hidden { display: none !important; }
        
        .form-group { margin-bottom: 15px; }
        .form-label { display: block; color: #d4a373; font-size: 12px; font-weight: bold; margin-bottom: 5px; text-transform: uppercase; }
        .input-row { display: flex; gap: 10px; }
        .btn-gps { width: auto; background-color: #2c2c2e; color: #d4a373; padding: 0 15px; margin-bottom: 15px; font-weight: bold; }
        
        .card { background-color: #1c1c1e; padding: 15px; border-radius: 10px; margin-bottom: 12px; border-left: 4px solid #d4a373; }
        .card-header { font-size: 12px; color: #8e8e93; margin-bottom: 8px; display: flex; justify-content: space-between; align-items: center; }
        .card-title { font-weight: bold; font-size: 16px; margin-bottom: 5px; }
        .card-detail { font-size: 14px; color: #d1d1d6; margin-bottom: 4px; }
        .relation-box { background-color: #2c2c2e; padding: 8px; border-radius: 6px; margin-top: 10px; font-size: 13px; border-left: 2px solid #30d158; }
        
        .section-title { color: #8e8e93; font-size: 14px; margin: 20px 0 10px 0; border-bottom: 1px solid #2c2c2e; padding-bottom: 5px; }
        .badge { display: inline-block; padding: 3px 6px; border-radius: 4px; font-size: 11px; font-weight: bold; margin-right: 5px; background-color: #333; }
        .badge-veh { color: #5e5ce6; background-color: rgba(94, 92, 230, 0.2); }
        .badge-per { color: #30d158; background-color: rgba(48, 209, 88, 0.2); }

        .detalle-bloque { background-color: #1c1c1e; padding: 15px; border-radius: 8px; margin-bottom: 15px; border: 1px solid #2c2c2e; }
        .detalle-item { margin-bottom: 8px; font-size: 15px; }
        .detalle-label { color: #8e8e93; font-size: 12px; text-transform: uppercase; display: block; margin-bottom: 2px; }

        .pdf-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #2c2c2e; padding-bottom: 15px; margin-bottom: 15px; }
        .pdf-header-left { display: flex; align-items: center; }
        .pdf-header img { width: 65px; height: auto; margin-right: 15px; }
        .pdf-header h2 { border: none; margin: 0; padding: 0; font-size: 18px; }
        .pdf-header-right { font-weight: bold; font-size: 16px; color: #d4a373; text-align: right; }

        .photo-input-container { border: 1px dashed #d4a373; padding: 10px; border-radius: 8px; text-align: center; margin-bottom: 15px; cursor: pointer; background-color: #151518;}
        .photo-input-container input[type="file"] { display: none; }
        .photo-preview { max-width: 100%; max-height: 200px; border-radius: 8px; margin-top: 10px; display: none; }
        .photo-label { color: #d4a373; font-size: 14px; font-weight: bold; display: flex; align-items: center; justify-content: center; gap: 8px; }

        .tabs { display: flex; margin-bottom: 15px; background-color: #1c1c1e; border-radius: 8px; padding: 4px; border: 1px solid #2c2c2e; }
        .tab-btn { flex: 1; margin: 0; background-color: transparent; color: #8e8e93; padding: 10px; border-radius: 6px; font-size: 14px; }
        .tab-btn.active { background-color: #d4a373; color: #000; }

        .actuantes-box { margin-top: 40px; text-align: right; page-break-inside: avoid; }
        .actuantes-line { font-weight: bold; font-size: 16px; border-top: 1px solid #2c2c2e; display: inline-block; padding-top: 10px; min-width: 200px; text-align: center; }

        @media print {
            body { background-color: #fff; color: #000; padding: 0; }
            .no-print, button, #login-screen, #main-screen, #form-screen, #search-screen, #tools-screen, #notes-screen, #records-screen, #record-form-screen { display: none !important; }
            #details-screen { display: block !important; }
            .detalle-bloque { background-color: #fff; border: 1px solid #ccc; color: #000; margin-bottom: 10px; }
            .detalle-label { color: #555; }
            * { color: #000 !important; }
            .pdf-header { border-bottom: 2px solid #000; }
            .pdf-header-right { color: #000; font-size: 18px; }
            .actuantes-line { border-top: 1px solid #000; }
        }
    </style>
</head>
<body>

    <div id="login-screen">
        <h2>Identificación Operativa</h2>
        <input type="password" id="pinInput" placeholder="Introduce PIN de acceso" inputmode="numeric" pattern="[0-9]*">
        <button onclick="acceder()">Entrar</button>
        <p id="loginError" style="color: #ff453a; display: none; font-size: 14px;">PIN incorrecto.</p>
    </div>

    <div id="main-screen" class="hidden">
        <h2>Gestión Operativa</h2>
        <button onclick="prepararNuevoAviso()">📞 Registrar Llamada / Aviso</button>
        <button onclick="mostrar('records-screen')" style="background-color: #5e5ce6; color: #fff;">🗂️ Registro de Identificaciones</button>
        <button onclick="mostrar('notes-screen')" style="background-color: #30d158; color: #000;">📝 Bloc de Notas</button>
        <button onclick="mostrar('search-screen')">🔍 Buscador e Historial</button>
        <button onclick="mostrar('tools-screen')" class="secondary">🛠 Normativa y Enlaces</button>
        <button class="secondary" onclick="cerrarSesion()" style="margin-top: 30px; background-color: #1c1c1e;">Cerrar Sesión</button>
    </div>

    <!-- MÓDULO REGISTROS (Personas y Vehículos) -->
    <div id="records-screen" class="hidden">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
            <h2 id="records-title" style="display: flex; align-items: center; gap: 8px;"><span>🗂️</span> <span id="records-header-text">PERSONAS</span></h2>
            <div style="display: flex; gap: 10px;">
                <button class="secondary" onclick="mostrarFormularioRegistro()" style="width: auto; padding: 5px 10px; margin: 0; border-radius: 8px; border: 1px solid #d4a373; color: #d4a373; font-size: 12px;">+ Añadir</button>
                <button class="secondary" onclick="mostrar('main-screen')" style="width: auto; padding: 5px 10px; margin: 0; border-radius: 15px;">X</button>
            </div>
        </div>

        <div class="tabs">
            <button id="tab-personas" class="tab-btn active" onclick="cambiarTabRegistros('personas')">👥 Personas</button>
            <button id="tab-vehiculos" class="tab-btn" onclick="cambiarTabRegistros('vehiculos')">🚗 Vehículos</button>
        </div>

        <input type="text" id="busqueda-registros" placeholder="Buscar nombre, DNI, matrícula..." onkeyup="ejecutarBusquedaRegistros()">
        
        <div id="lista-registros" style="margin-top: 20px;"></div>
    </div>

    <!-- FORMULARIO DE REGISTRO -->
    <div id="record-form-screen" class="hidden">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
            <h2 id="record-form-title">NUEVO REGISTRO</h2>
            <button class="secondary" onclick="mostrar('records-screen')" style="width: auto; padding: 5px 10px; margin: 0; border-radius: 15px;">&larr; Volver</button>
        </div>

        <div id="form-fields-persona" class="hidden">
            <div class="form-group"><label class="form-label">👤 NOMBRE Y APELLIDOS</label><input type="text" id="reg-per-nombre" placeholder="Nombre completo"></div>
            <div class="input-row">
                <div class="form-group" style="flex: 1;"><label class="form-label">🪪 Nº DOCUMENTO</label><input type="text" id="reg-per-dni" placeholder="DNI/NIE" style="text-transform: uppercase;"></div>
                <div class="form-group" style="flex: 1;"><label class="form-label">🌍 NACIMIENTO</label><input type="text" id="reg-per-lugar-nac" placeholder="Lugar"></div>
            </div>
            <div class="input-row">
                <div class="form-group" style="flex: 1;"><label class="form-label">📅 FECHA NAC.</label><input type="date" id="reg-per-fecha-nac"></div>
                <div class="form-group" style="flex: 1;"><label class="form-label">📞 TELÉFONO</label><input type="tel" id="reg-per-tlf" placeholder="Número"></div>
            </div>
            <div class="form-group"><label class="form-label">👨‍👩‍👦 NOMBRE DE LOS PADRES</label><input type="text" id="reg-per-padres" placeholder="Padre y Madre"></div>
            <div class="form-group"><label class="form-label">🏠 DOMICILIO</label><input type="text" id="reg-per-domicilio" placeholder="Dirección completa"></div>
            <div class="input-row">
                <div class="form-group" style="flex: 1;"><label class="form-label">🚗 VEHÍCULO HABITUAL</label><input type="text" id="reg-per-veh-desc" placeholder="Marca/Modelo"></div>
                <div class="form-group" style="flex: 1;"><label class="form-label">🔢 MATRÍCULA</label><input type="text" id="reg-per-veh-mat" placeholder="Matrícula" style="text-transform: uppercase;"></div>
            </div>
            <div class="form-group">
                <label class="form-label">📷 FOTOGRAFÍAS</label>
                <label class="photo-input-container">
                    <span class="photo-label">📷 Tomar Foto / Galería</span>
                    <input type="file" id="reg-per-foto-input" accept="image/*" onchange="previsualizarFoto(event, 'reg-per-foto-preview')">
                </label>
                <img id="reg-per-foto-preview" class="photo-preview" src="" alt="Previsualización">
            </div>
        </div>

        <div id="form-fields-vehiculo" class="hidden">
            <div class="input-row">
                <div class="form-group" style="flex: 1;"><label class="form-label">🔢 MATRÍCULA</label><input type="text" id="reg-veh-mat" placeholder="1234ABC" style="text-transform: uppercase;"></div>
                <div class="form-group" style="flex: 1;"><label class="form-label">🎨 COLOR</label><input type="text" id="reg-veh-color" placeholder="Ej: Blanco"></div>
            </div>
            <div class="input-row">
                <div class="form-group" style="flex: 1;"><label class="form-label">🏷️ MARCA</label><input type="text" id="reg-veh-marca" placeholder="Ej: Seat"></div>
                <div class="form-group" style="flex: 1;"><label class="form-label">🚘 MODELO</label><input type="text" id="reg-veh-modelo" placeholder="Ej: León"></div>
            </div>
            <div class="form-group"><label class="form-label">🔧 BASTIDOR (VIN)</label><input type="text" id="reg-veh-vin" placeholder="17 CARACTERES" style="text-transform: uppercase;"></div>
            <div class="form-group"><label class="form-label">👤 TITULAR / CONDUCTOR</label><input type="text" id="reg-veh-titular" placeholder="Nombre completo"></div>
            <div class="form-group"><label class="form-label">🪪 DOCUMENTO (DNI/NIE)</label><input type="text" id="reg-veh-titular-dni" placeholder="DNI/NIE" style="text-transform: uppercase;"></div>
            <div class="form-group">
                <label class="form-label">📷 FOTOGRAFÍAS</label>
                <label class="photo-input-container">
                    <span class="photo-label">📷 Tomar Foto / Galería</span>
                    <input type="file" id="reg-veh-foto-input" accept="image/*" onchange="previsualizarFoto(event, 'reg-veh-foto-preview')">
                </label>
                <img id="reg-veh-foto-preview" class="photo-preview" src="" alt="Previsualización">
            </div>
            <div class="form-group"><label class="form-label">📝 OBSERVACIONES</label><textarea id="reg-veh-obs" rows="3" placeholder="Estado del vehículo..."></textarea></div>
        </div>

        <button id="btn-guardar-registro" onclick="guardarRegistro()" style="font-size: 18px; padding: 16px; margin-top: 10px;">Guardar Registro</button>
    </div>

    <!-- MÓDULO BLOC DE NOTAS -->
    <div id="notes-screen" class="hidden">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
            <h2>📝 Bloc de Notas</h2>
            <button class="secondary" onclick="mostrar('main-screen')" style="width: auto; padding: 5px 10px; margin: 0; border-radius: 15px;">X</button>
        </div>
        <div class="form-group">
            <input type="text" id="nuevaNotaActuante" placeholder="Agente actuante (Ej: 1234)">
            <textarea id="nuevaNota" rows="5" placeholder="Escribe aquí tu anotación libre (matrículas sueltas, recordatorios...)"></textarea>
            <button id="btn-guardar-nota" onclick="guardarNota()">Guardar Nota</button>
            <button id="btn-cancelar-nota" class="secondary hidden" onclick="cancelarEdicionNota()">Cancelar Edición</button>
        </div>
        <div id="lista-notas" style="margin-top: 25px;"></div>
    </div>

    <!-- PANTALLA REGISTRO AVISOS -->
    <div id="form-screen" class="hidden">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 15px;">
            <h2 id="titulo-form">📞 Registrar Aviso</h2>
            <button class="secondary" onclick="mostrar('main-screen')" style="width: auto; padding: 5px 10px; margin: 0; border-radius: 15px;">X</button>
        </div>
        <div class="form-group"><label class="form-label">🕒 Fecha y Hora</label><input type="datetime-local" id="fechaHora"></div>
        <div class="form-group"><label class="form-label">📞 Teléfono Requirente</label><input type="tel" id="telefono" placeholder="Nº de teléfono"></div>
        <div class="form-group"><label class="form-label">👤 Nombre del Comunicante</label><input type="text" id="comunicante" placeholder="Nombre completo del comunicante"></div>
        <div class="form-group"><label class="form-label">🎯 Motivo de la Llamada</label><input type="text" id="motivo" placeholder="Ej: Vado permanente, Ruido, Alarma..."></div>
        <div class="form-group">
            <label class="form-label">📍 Lugar de los Hechos</label>
            <div class="input-row">
                <input type="text" id="lugar" placeholder="Lugar, calle o número exacto...">
                <button class="btn-gps" onclick="obtenerGPS()">📍 GPS</button>
            </div>
        </div>
        <div class="form-group"><label class="form-label">👮 AGENTES ACTUANTES</label><input type="text" id="actuantes" placeholder="Ej: Agentes 1234 y 5678..."></div>
        
        <div class="form-group">
            <label class="form-label">📝 Observaciones</label>
            <textarea id="observaciones" rows="3" placeholder="Detalles de la llamada o indicaciones dadas..."></textarea>
            <label class="photo-input-container" style="margin-top: 10px; margin-bottom: 0;">
                <span class="photo-label">📷 Añadir Foto a Observaciones</span>
                <input type="file" id="aviso-foto-input" accept="image/*" onchange="previsualizarFoto(event, 'aviso-foto-preview')">
            </label>
            <img id="aviso-foto-preview" class="photo-preview" src="" alt="Previsualización">
        </div>

        <div class="form-group" style="background-color: #151518; padding: 15px; border-radius: 8px; border: 1px solid #2c2c2e;">
            <label class="form-label" style="color: #fff; margin-bottom: 10px;">🔗 Implicados en la intervención</label>
            <div style="background-color: #1c1c1e; padding: 10px; border-radius: 6px; margin-bottom: 10px;">
                <label style="font-size: 12px; color: #30d158; font-weight: bold;">👤 AÑADIR PERSONA</label>
                <input type="text" id="dniPer" placeholder="DNI / NIE / Pasaporte" style="text-transform: uppercase; margin-top: 8px; margin-bottom: 8px;">
                <input type="text" id="nombrePer" placeholder="Nombre y apellidos" style="margin-bottom: 8px;">
                <span style="font-size: 12px; color: #8e8e93; display: block; margin-bottom: 4px;">Fecha de Nacimiento</span>
                <input type="date" id="fnacPer" style="margin-bottom: 8px;">
                <input type="tel" id="tlfPer" placeholder="Teléfono de contacto" style="margin-bottom: 8px;">
                <input type="text" id="domPer" placeholder="Domicilio completo" style="margin-bottom: 8px;">
                <button class="add-btn" onclick="añadirImplicado('persona')">&plus; Vincular Persona</button>
            </div>
            <div style="background-color: #1c1c1e; padding: 10px; border-radius: 6px;">
                <label style="font-size: 12px; color: #5e5ce6; font-weight: bold;">🚗 AÑADIR VEHÍCULO</label>
                <input type="text" id="matVeh" placeholder="Matrícula" style="text-transform: uppercase; margin-top: 8px; margin-bottom: 8px;">
                <input type="text" id="descVeh" placeholder="Marca, modelo y color" style="margin-bottom: 8px;">
                <button class="add-btn" onclick="añadirImplicado('vehiculo')">&plus; Vincular Vehículo</button>
            </div>
            <div id="lista-implicados-temp" style="margin-top: 15px;"></div>
        </div>
        <button id="btn-guardar-aviso" onclick="guardarAviso()" style="font-size: 18px; padding: 16px; margin-top: 10px;">Guardar Aviso</button>
    </div>

    <div id="search-screen" class="hidden">
        <h2>Buscador Operativo</h2>
        <input type="text" id="busqueda" placeholder="Buscar DNI, Matrícula, Motivo o Notas..." onkeyup="ejecutarBusqueda()" style="text-transform: uppercase;">
        <button class="secondary" onclick="mostrar('main-screen')">Volver al Menú</button>
        
        <div id="resultados-vehiculos"></div>
        <div id="resultados-personas"></div>
        <div id="resultados-intervenciones"></div>
        <div id="resultados-notas"></div>
    </div>

    <div id="details-screen" class="hidden">
        <div id="details-action-bar" class="no-print" style="display: flex; gap: 8px; margin-bottom: 15px; flex-wrap: wrap;"></div>
        <div id="print-content"></div>
    </div>

    <div id="tools-screen" class="hidden">
        <h2>Normativa y Enlaces</h2>
        <a href="https://www.boe.es/biblioteca_juridica/codigos/codigo.php?id=020_Codigo_de_Trafico_y_Seguridad_Vial" target="_blank" rel="noopener noreferrer" style="text-decoration: none;">
            <button class="secondary" style="text-align: left; border-left: 4px solid #d4a373;">📖 BOE: Código de Tráfico</button>
        </a>
        <a href="https://www.ofesauto.es/" target="_blank" rel="noopener noreferrer" style="text-decoration: none;">
            <button class="secondary" style="text-align: left; border-left: 4px solid #d4a373;">🌍 OFESAUTO (Matrículas)</button>
        </a>
        <button class="secondary" onclick="mostrar('main-screen')" style="margin-top: 30px;">Volver</button>
    </div>

    <script>
        let db = JSON.parse(localStorage.getItem('db_policial_v3')) || [];
        let dbNotas = JSON.parse(localStorage.getItem('db_notas_v1')) || [];
        let dbPersonas = JSON.parse(localStorage.getItem('db_personas_v1')) || [];
        let dbVehiculos = JSON.parse(localStorage.getItem('db_vehiculos_v1')) || [];
        
        let implicadosTemporales = [];
        let editandoIntervencionId = null;
        let editandoNotaId = null;
        let editandoRegistroId = null;
        let tabRegistroActual = 'personas';

        function acceder() {
            const pin = document.getElementById('pinInput').value;
            let pinGuardado = localStorage.getItem('pin_policial');
            if (!pinGuardado) {
                if(pin.length < 4) { alert("Mínimo 4 dígitos."); return; }
                localStorage.setItem('pin_policial', pin);
                mostrar('main-screen');
            } else if (pin === pinGuardado) {
                mostrar('main-screen');
            } else {
                document.getElementById('loginError').style.display = 'block';
            }
        }

        function cerrarSesion() {
            document.getElementById('pinInput').value = '';
            mostrar('login-screen');
        }

        function mostrar(pantalla) {
            document.querySelectorAll('body > div').forEach(div => {
                if(div.id !== 'print-content') div.classList.add('hidden');
            });
            document.getElementById(pantalla).classList.remove('hidden');
            
            if(pantalla === 'search-screen') ejecutarBusqueda(); 
            if(pantalla === 'notes-screen') {
                cancelarEdicionNota();
                cargarNotas();
            }
            if(pantalla === 'records-screen') {
                ejecutarBusquedaRegistros();
            }
        }

        function configurarFechaActual() {
            const now = new Date();
            now.setMinutes(now.getMinutes() - now.getTimezoneOffset());
            document.getElementById('fechaHora').value = now.toISOString().slice(0, 16);
        }

        function formateaFecha(fechaISO) {
            if(!fechaISO) return "";
            const fecha = new Date(fechaISO);
            const opciones = { day: '2-digit', month: '2-digit', year: 'numeric', hour: '2-digit', minute: '2-digit' };
            return fecha.toLocaleDateString('es-ES', opciones).replace(',', '');
        }

        function formateaFechaCorta(fechaInput) {
            if(!fechaInput) return "";
            const partes = fechaInput.split('-');
            if(partes.length === 3) return `${partes[2]}/${partes[1]}/${partes[0]}`;
            return fechaInput;
        }

        function obtenerGPS() {
            const inputLugar = document.getElementById('lugar');
            inputLugar.value = "Obteniendo coordenadas...";
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    (pos) => { inputLugar.value = `${pos.coords.latitude.toFixed(6)}, ${pos.coords.longitude.toFixed(6)}`; },
                    (err) => { inputLugar.value = ""; alert("No se pudo obtener la ubicación. Verifica permisos."); },
                    { enableHighAccuracy: true, timeout: 5000 }
                );
            }
        }

        function previsualizarFoto(event, previewId) {
            const file = event.target.files[0];
            const preview = document.getElementById(previewId);
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    preview.src = e.target.result;
                    preview.style.display = 'block';
                    preview.setAttribute('data-base64', e.target.result);
                }
                reader.readAsDataURL(file);
            } else {
                preview.src = "";
                preview.style.display = 'none';
                preview.removeAttribute('data-base64');
            }
        }

        function getBase64FromPreview(previewId) {
            const preview = document.getElementById(previewId);
            return preview.getAttribute('data-base64') || null;
        }

        function setBase64ToPreview(previewId, base64String) {
            const preview = document.getElementById(previewId);
            if(base64String) {
                preview.src = base64String;
                preview.style.display = 'block';
                preview.setAttribute('data-base64', base64String);
            } else {
                preview.src = "";
                preview.style.display = 'none';
                preview.removeAttribute('data-base64');
            }
        }

            document.getElementById('tab-vehiculos').classList.remove('active');

        function mostrarFormularioRegistro(idEditar = null) {
            editandoRegistroId = idEditar;

                document.getElementById('record-form-title').innerText = idEditar ? "✏️ EDITAR PERSONA" : "NUEVA PERSONA";

        function guardarRegistro() {
            if(tabRegistroActual === 'personas') {
                const nombre = document.getElementById('reg-per-nombre').value.trim();
                const dni = document.getElementById('reg-per-dni').value.trim().toUpperCase();
                if(!nombre && !dni) { alert("Introduce al menos un Nombre o DNI."); return; }
                
                const datos = {
                    nombre: nombre, dni: dni,
                    lugarNac: document.getElementById('reg-per-lugar-nac').value.trim(),
                    fechaNac: document.getElementById('reg-per-fecha-nac').value,
                    tlf: document.getElementById('reg-per-tlf').value.trim(),
                    padres: document.getElementById('reg-per-padres').value.trim(),
                    domicilio: document.getElementById('reg-per-domicilio').value.trim(),
                    vehDesc: document.getElementById('reg-per-veh-desc').value.trim(),
                    vehMat: document.getElementById('reg-per-veh-mat').value.trim().toUpperCase(),
                    foto: getBase64FromPreview('reg-per-foto-preview')
                };

                if(editandoRegistroId) {
                    const idx = dbPersonas.findIndex(p => p.id === editandoRegistroId);
                    if(idx !== -1) dbPersonas[idx] = { ...dbPersonas[idx], ...datos };
                } else {
                    datos.id = Date.now();
                    dbPersonas.push(datos);
                }
                localStorage.setItem('db_personas_v1', JSON.stringify(dbPersonas));

            } else {
                const mat = document.getElementById('reg-veh-mat').value.trim().toUpperCase();
                if(!mat) { alert("La matrícula es obligatoria."); return; }

                const datos = {
                    mat: mat, color: document.getElementById('reg-veh-color').value.trim(),
                    marca: document.getElementById('reg-veh-marca').value.trim(),
                    modelo: document.getElementById('reg-veh-modelo').value.trim(),
                    vin: document.getElementById('reg-veh-vin').value.trim().toUpperCase(),
                    titular: document.getElementById('reg-veh-titular').value.trim(),
                    titularDni: document.getElementById('reg-veh-titular-dni').value.trim().toUpperCase(),
                    obs: document.getElementById('reg-veh-obs').value.trim(),
                    foto: getBase64FromPreview('reg-veh-foto-preview')
                };

                if(editandoRegistroId) {
                    const idx = dbVehiculos.findIndex(v => v.id === editandoRegistroId);
                    if(idx !== -1) dbVehiculos[idx] = { ...dbVehiculos[idx], ...datos };
                } else {
                    datos.id = Date.now();
                    dbVehiculos.push(datos);
                }
                localStorage.setItem('db_vehiculos_v1', JSON.stringify(dbVehiculos));
            }
            alert("Registro guardado.");
            mostrar('records-screen');
        }

        function ejecutarBusquedaRegistros() {
            const termino = document.getElementById('busqueda-registros').value.toUpperCase();
            const divLista = document.getElementById('lista-registros');
            divLista.innerHTML = '';
            let hayResultados = false;

            if(tabRegistroActual === 'personas') {
                const filtrados = dbPersonas.filter(p => 
                    !termino || (p.nombre && p.nombre.toUpperCase().includes(termino)) || 
                    (p.dni && p.dni.includes(termino)) || (p.vehMat && p.vehMat.includes(termino))
                );
                filtrados.reverse().forEach(p => {
                    hayResultados = true;
                    divLista.innerHTML += `
                        <div class="card" style="border-left-color: #30d158; cursor:pointer;" onclick="verRegistroCompleto(${p.id}, 'personas')">
                            <div class="card-title">👤 ${p.nombre || 'Sin nombre'}</div>
                            <div class="card-detail"><b>DNI:</b> ${p.dni || '-'}</div>
                            ${p.vehMat ? `<div class="card-detail"><b>Vehículo:</b> ${p.vehMat}</div>` : ''}
                        </div>`;
                });
                if(!hayResultados) divLista.innerHTML = `<p style="color:#8e8e93; text-align:center;">No hay personas registradas.</p>`;

            } else {
                const filtrados = dbVehiculos.filter(v => 
                    !termino || (v.mat && v.mat.includes(termino)) || 
                    (v.marca && v.marca.toUpperCase().includes(termino)) || (v.titularDni && v.titularDni.includes(termino))
                );
                filtrados.reverse().forEach(v => {
                    hayResultados = true;
                    divLista.innerHTML += `
                        <div class="card" style="border-left-color: #5e5ce6; cursor:pointer;" onclick="verRegistroCompleto(${v.id}, 'vehiculos')">
                            <div class="card-title">🚗 ${v.mat || 'Sin matrícula'}</div>
                            <div class="card-detail"><b>Vehículo:</b> ${v.marca} ${v.modelo}</div>
                            ${v.titular ? `<div class="card-detail"><b>Titular:</b> ${v.titular}</div>` : ''}
                        </div>`;
                });
                if(!hayResultados) divLista.innerHTML = `<p style="color:#8e8e93; text-align:center;">No hay vehículos registrados.</p>`;
            }
        }

        function borrarRegistroBase(id, tipo) {
            if(confirm("¿Seguro que quieres borrar este registro?")) {
                if(tipo === 'personas') {
                    dbPersonas = dbPersonas.filter(p => p.id !== id);
                    localStorage.setItem('db_personas_v1', JSON.stringify(dbPersonas));
                } else {
                    dbVehiculos = dbVehiculos.filter(v => v.id !== id);
                    localStorage.setItem('db_vehiculos_v1', JSON.stringify(dbVehiculos));

        // --- SISTEMA DE NOTAS Y AVISOS ---

        function guardarNota() {
            const texto = document.getElementById('nuevaNota').value.trim();
            const actuante = document.getElementById('nuevaNotaActuante').value.trim();
            if(!texto) return;

            if (editandoNotaId) {
                const index = dbNotas.findIndex(n => n.id === editandoNotaId);
                if (index !== -1) {
                    dbNotas[index].texto = texto;
                    dbNotas[index].actuante = actuante;
                }
                alert("Nota actualizada.");
            } else {
                const nuevaNota = { id: Date.now(), fechaISO: new Date().toISOString(), texto: texto, actuante: actuante };
                dbNotas.push(nuevaNota);
            }
            
            localStorage.setItem('db_notas_v1', JSON.stringify(dbNotas));
            cancelarEdicionNota();
            cargarNotas();
        }

        function editarNota(id) {
            const nota = dbNotas.find(n => n.id === id);
            if(!nota) return;
            editandoNotaId = id;
            document.getElementById('nuevaNota').value = nota.texto;
            document.getElementById('nuevaNotaActuante').value = nota.actuante || '';
            document.getElementById('btn-guardar-nota').innerText = "Actualizar Nota";
            document.getElementById('btn-guardar-nota').style.backgroundColor = "#ffcc00"; 
            document.getElementById('btn-cancelar-nota').classList.remove('hidden');
            window.scrollTo(0, 0); 
        }

        function cancelarEdicionNota() {
            editandoNotaId = null;
            document.getElementById('nuevaNota').value = '';
            document.getElementById('nuevaNotaActuante').value = '';
            document.getElementById('btn-guardar-nota').innerText = "Guardar Nota";
            document.getElementById('btn-guardar-nota').style.backgroundColor = "#d4a373";
            document.getElementById('btn-cancelar-nota').classList.add('hidden');
        }

        function borrarNota(id) {
            if(confirm("¿Borrar esta nota permanentemente?")) {
                dbNotas = dbNotas.filter(n => n.id !== id);
                localStorage.setItem('db_notas_v1', JSON.stringify(dbNotas));
                cargarNotas();
            }
        }

        function cargarNotas() {
            const div = document.getElementById('lista-notas');
            div.innerHTML = '';
            if(dbNotas.length === 0) {
                div.innerHTML = '<p style="color:#8e8e93; font-size: 14px;">No hay notas guardadas.</p>';
                return;
            }
            [...dbNotas].reverse().forEach(nota => {
                const fechaF = formateaFecha(nota.fechaISO);
                div.innerHTML += `
                    <div class="card" style="border-left-color: #30d158;">
                        <div class="card-header">
                            <span>🕒 ${fechaF}</span>
                            <div style="font-size: 16px;">
                                <span style="cursor: pointer; padding: 0 8px;" onclick="imprimirNota(${nota.id})" title="Imprimir PDF">🖨️</span>
                                <span style="cursor: pointer; padding: 0 8px;" onclick="editarNota(${nota.id})" title="Editar">✏️</span>
                                <span style="color: #ff453a; font-weight: bold; cursor: pointer; padding: 0 8px;" onclick="borrarNota(${nota.id})" title="Borrar">X</span>
                            </div>
                        </div>
                        <div style="white-space: pre-wrap; font-size: 15px; color: #fff;">${nota.texto}</div>
                    </div>`;
            });
        }

        function imprimirNota(id) {
            const nota = dbNotas.find(n => n.id === id);
            if(!nota) return;

            document.getElementById('details-action-bar').innerHTML = `
                <button class="secondary" onclick="mostrar('notes-screen')" style="flex: 1; padding: 8px 10px; margin: 0; border-radius: 8px;">&larr; Volver</button>
                <button class="secondary" onclick="editarNota(${nota.id}); mostrar('notes-screen');" style="flex: 1; padding: 8px 10px; margin: 0; border-radius: 8px; border: 1px solid #d4a373; color: #d4a373;">✏️ Editar</button>
                <button onclick="window.print()" style="flex: 1; padding: 8px 10px; margin: 0; background-color: #30d158; color: #000; border-radius: 8px;">🖨️ PDF</button>
            `;

            const htmlDetalle = `
                <div class="pdf-header" style="justify-content: flex-start;">
                    <div class="pdf-header-left">
                        <img src="escudo.png" alt="Escudo" onerror="this.style.display='none'">
                        <div>
                            <h2>Anotación</h2>
                            <div style="font-size: 14px; color: #8e8e93; margin-top: 4px;">Fecha: ${formateaFecha(nota.fechaISO)}</div>

                    </div>
                </div>
                
                <div class="detalle-bloque" style="font-size: 16px; white-space: pre-wrap; line-height: 1.5;">${nota.texto}</div>
                
                ${nota.actuante ? `
                <div class="actuantes-box">
                    <div style="font-size: 12px; color: #8e8e93; text-transform: uppercase; margin-bottom: 5px;">Agente Actuante</div>
                    <div class="actuantes-line">${nota.actuante}</div>
                </div>` : ''}

            document.getElementById('btn-guardar-aviso').innerText = "Guardar Aviso";

            editandoIntervencionId = id;
            document.getElementById('titulo-form').innerText = `✏️ EDITAR AVISO #${id}`;

        function añadirImplicado(tipo) {
            let dato = '', nota = '', fnac = '', tlf = '', dom = '';
            if (tipo === 'persona') {
                dato = document.getElementById('dniPer').value.trim().toUpperCase();
                nota = document.getElementById('nombrePer').value.trim();
                fnac = document.getElementById('fnacPer').value;
                tlf = document.getElementById('tlfPer').value.trim();
                dom = document.getElementById('domPer').value.trim();
                if(!dato && !nota) return;
                document.getElementById('dniPer').value = ''; document.getElementById('nombrePer').value = '';
                document.getElementById('fnacPer').value = ''; document.getElementById('tlfPer').value = ''; document.getElementById('domPer').value = '';
            } else {
                dato = document.getElementById('matVeh').value.trim().toUpperCase();
                nota = document.getElementById('descVeh').value.trim();
                if(!dato && !nota) return;
                document.getElementById('matVeh').value = ''; document.getElementById('descVeh').value = '';
            }
            implicadosTemporales.push({ tipo, dato, nota, fnac, tlf, dom });
            actualizarListaImplicados();
        }

        function actualizarListaImplicados() {
            const div = document.getElementById('lista-implicados-temp');
            div.innerHTML = '';
            implicadosTemporales.forEach((imp, index) => {
                const icono = imp.tipo === 'persona' ? '👤' : '🚗';
                const color = imp.tipo === 'persona' ? '#30d158' : '#5e5ce6';
                let extras = '';
                if(imp.tipo === 'persona') {
                    if(imp.fnac) extras += ` F.Nac: ${formateaFechaCorta(imp.fnac)}`;
                    if(imp.tlf) extras += ` | Tlf: ${imp.tlf}`;
                    if(imp.dom) extras += ` | Dom: ${imp.dom}`;
                }
                div.innerHTML += `<div style="background: #2c2c2e; border-left: 3px solid ${color}; padding: 8px; margin-bottom: 5px; border-radius: 5px; font-size: 13px; display: flex; justify-content: space-between;">
                    <div>${icono} <b>${imp.dato}</b> - ${imp.nota} <br><span style="color:#8e8e93; font-size:11px;">${extras}</span></div>
                    <span style="color: #ff453a; font-weight: bold; padding: 0 10px; font-size: 16px; align-self: center; cursor:pointer;" onclick="borrarImplicado(${index})">X</span>
                </div>`;
            });
        }

        function borrarImplicado(index) {
            implicadosTemporales.splice(index, 1);
            actualizarListaImplicados();
        }

        function guardarAviso() {
            const motivo = document.getElementById('motivo').value.trim();
            if (!motivo) { alert("El motivo de la llamada es obligatorio."); return; }
            
            if (editandoIntervencionId) {
                const index = db.findIndex(r => r.id === editandoIntervencionId);
                if(index !== -1) {
                    db[index].fechaISO = document.getElementById('fechaHora').value;
                    db[index].telefono = document.getElementById('telefono').value.trim();
                    db[index].comunicante = document.getElementById('comunicante').value.trim();
                    db[index].motivo = motivo;
                    db[index].lugar = document.getElementById('lugar').value.trim();
                    db[index].actuantes = document.getElementById('actuantes').value.trim();
                    db[index].observaciones = document.getElementById('observaciones').value.trim();
                    db[index].implicados = [...implicadosTemporales];
                    db[index].fotoObservaciones = getBase64FromPreview('aviso-foto-preview');
                }
                localStorage.setItem('db_policial_v3', JSON.stringify(db));
                alert(`Aviso #${editandoIntervencionId} Actualizado.`);
                verAvisoCompleto(editandoIntervencionId);
                
            } else {
                let nuevoID = 1;
                if (db.length > 0) nuevoID = Math.max(...db.map(r => r.id)) + 1;

                const nuevaIntervencion = {
                    id: nuevoID, 
                    fechaISO: document.getElementById('fechaHora').value,
                    telefono: document.getElementById('telefono').value.trim(), 
                    comunicante: document.getElementById('comunicante').value.trim(),
                    motivo: motivo, 
                    lugar: document.getElementById('lugar').value.trim(),
                    actuantes: document.getElementById('actuantes').value.trim(),
                    observaciones: document.getElementById('observaciones').value.trim(), 
                    implicados: [...implicadosTemporales],
                    fotoObservaciones: getBase64FromPreview('aviso-foto-preview')
                };
                db.push(nuevaIntervencion);
                localStorage.setItem('db_policial_v3', JSON.stringify(db));
                
                alert(`Aviso Guardado. Intervención Nº: #${nuevoID}`);
                verAvisoCompleto(nuevoID);
            }
        }

        function ejecutarBusqueda() {
            const termino = document.getElementById('busqueda').value.toUpperCase();
            const divVeh = document.getElementById('resultados-vehiculos');
            const divPer = document.getElementById('resultados-personas');
            const divInt = document.getElementById('resultados-intervenciones');
            const divNot = document.getElementById('resultados-notas');
            
            divVeh.innerHTML = ''; divPer.innerHTML = ''; divInt.innerHTML = ''; divNot.innerHTML = '';
            if(!termino) return;

            let htmlVeh = ''; let htmlPer = ''; let htmlInt = ''; let htmlNot = '';

            for (let i = db.length - 1; i >= 0; i--) {
                const reg = db[i];
                let intervencionMostrada = false;
                const fechaFormateada = formateaFecha(reg.fechaISO);
                const botonDetalle = `<button class="secondary" onclick="verAvisoCompleto(${reg.id})" style="width: 100%; border: 1px solid #d4a373; color: #d4a373; margin-top: 12px; font-size: 14px;">📄 Ver Aviso Completo</button>`;

                if(reg.implicados && reg.implicados.length > 0) {
                    reg.implicados.forEach(imp => {
                        if(imp.dato.includes(termino) || imp.nota.toUpperCase().includes(termino)) {
                            let relacionadosHtml = '';
                            let otrosImplicados = reg.implicados.filter(o => o.dato !== imp.dato);
                            if(otrosImplicados.length > 0) {
                                relacionadosHtml = `<div class="relation-box"><b>Relacionado en la Intervención #${reg.id}:</b><br>`;
                                otrosImplicados.forEach(o => { relacionadosHtml += `↳ ${o.tipo === 'persona' ? 'Persona' : 'Vehículo'}: ${o.dato} (${o.nota})<br>`; });
                                relacionadosHtml += `</div>`;
                            }
                            const tarjeta = `<div class="card">
                                    <div class="card-header"><span>INT #${reg.id}</span><span>${fechaFormateada}</span></div>
                                    <div class="card-title"><span class="badge ${imp.tipo === 'vehiculo' ? 'badge-veh' : 'badge-per'}">${imp.tipo === 'vehiculo' ? 'VEHÍCULO' : 'PERSONA'}</span> ${imp.dato}</div>
                                    <div class="card-detail"><b>Detalles:</b> ${imp.nota}</div>
                                    <div class="card-detail"><b>Motivo Aviso:</b> ${reg.motivo}</div>
                                    ${relacionadosHtml}
                                    ${botonDetalle}
                                </div>`;
                            if(imp.tipo === 'vehiculo') htmlVeh += tarjeta; else htmlPer += tarjeta;
                            intervencionMostrada = true;
                        }
                    });
                }

                if(!intervencionMostrada) {
                    if((reg.motivo && reg.motivo.toUpperCase().includes(termino)) || (reg.lugar && reg.lugar.toUpperCase().includes(termino)) ||
                       (reg.observaciones && reg.observaciones.toUpperCase().includes(termino)) || (reg.telefono && reg.telefono.includes(termino)) ||
                       (reg.comunicante && reg.comunicante.toUpperCase().includes(termino)) ||
                       (reg.actuantes && reg.actuantes.toUpperCase().includes(termino))) {
                        htmlInt += `<div class="card" style="border-left-color: #8e8e93;">
                                <div class="card-header"><span>INT #${reg.id}</span><span>${fechaFormateada}</span></div>
                                <div class="card-title">📞 Aviso: ${reg.motivo}</div>
                                <div class="card-detail"><b>Lugar:</b> ${reg.lugar}</div>
                                ${botonDetalle}
                            </div>`;
                    }
                }
            }

            for (let i = dbNotas.length - 1; i >= 0; i--) {
                const nota = dbNotas[i];
                if(nota.texto.toUpperCase().includes(termino) || (nota.actuante && nota.actuante.toUpperCase().includes(termino))) {
                    const fechaFormateada = formateaFecha(nota.fechaISO);
                    htmlNot += `<div class="card" style="border-left-color: #30d158; cursor: pointer;" onclick="imprimirNota(${nota.id})">
                        <div class="card-header"><span>🕒 ${fechaFormateada}</span><span>📄 Ver</span></div>
                        <div style="white-space: pre-wrap; font-size: 14px; color: #d1d1d6;">${nota.texto}</div>
                    </div>`;
                }
            }

            if(htmlVeh) divVeh.innerHTML = `<div class="section-title">🚗 VEHÍCULOS ENCONTRADOS</div>` + htmlVeh;
            if(htmlPer) divPer.innerHTML = `<div class="section-title">👤 PERSONAS ENCONTRADAS</div>` + htmlPer;
            if(htmlInt) divInt.innerHTML = `<div class="section-title">📞 AVISOS / MOTIVOS</div>` + htmlInt;
            if(htmlNot) divNot.innerHTML = `<div class="section-title">📝 NOTAS LIBRES ENCONTRADAS</div>` + htmlNot;
            if(!htmlVeh && !htmlPer && !htmlInt && !htmlNot) divInt.innerHTML = '<p style="color:#8e8e93; font-size: 14px;">No se han encontrado registros ni notas.</p>';
        }

        function verAvisoCompleto(idIntervencion) {
            const reg = db.find(r => r.id === idIntervencion);
            if(!reg) return;

            document.getElementById('details-action-bar').innerHTML = `
                <button class="secondary" onclick="mostrar('search-screen')" style="flex: 1; padding: 8px 10px; margin: 0; border-radius: 8px;">&larr; Volver</button>
                <button class="secondary" onclick="editarAviso(${reg.id})" style="flex: 1; padding: 8px 10px; margin: 0; border-radius: 8px; border: 1px solid #d4a373; color: #d4a373;">✏️ Editar</button>
                <button onclick="window.print()" style="flex: 1; padding: 8px 10px; margin: 0; background-color: #30d158; color: #000; border-radius: 8px;">🖨️ PDF</button>
            `;

            let htmlImplicados = '';
            if(reg.implicados && reg.implicados.length > 0) {
                reg.implicados.forEach(imp => {
                    const icono = imp.tipo === 'persona' ? '👤' : '🚗';
                    let detallesExtra = '';
                    if (imp.tipo === 'persona') {
                        if(imp.fnac) detallesExtra += `<div><b>F. Nacimiento:</b> ${formateaFechaCorta(imp.fnac)}</div>`;
                        if(imp.tlf) detallesExtra += `<div><b>Teléfono:</b> ${imp.tlf}</div>`;
                        if(imp.dom) detallesExtra += `<div><b>Domicilio:</b> ${imp.dom}</div>`;
                    }
                    htmlImplicados += `
                        <div class="detalle-item" style="background-color: #2c2c2e; padding: 10px; border-radius: 6px; margin-bottom: 10px;">
                            <div style="font-size: 16px;">${icono} <b>${imp.dato}</b> - ${imp.nota}</div>
                            <div style="color:#d1d1d6; font-size:14px; margin-top: 5px;">${detallesExtra}</div>
                        </div>`;
                });
            } else { htmlImplicados = `<div class="detalle-item" style="color:#8e8e93;">Sin identificados vinculados.</div>`; }

            const htmlDetalle = `
                <div class="pdf-header">
                    <div class="pdf-header-left">
                        <img src="escudo.png" alt="Escudo" onerror="this.style.display='none'">
                        <div>
                            <h2>INFORME DE SERVICIO</h2>
                            <div class="no-print" style="font-size: 12px; color: #8e8e93; margin-top: 4px;">Ref. Interna App: #${reg.id}</div>
                        </div>
                    </div>
                    <div class="pdf-header-right">
                        INT-
                    </div>
                </div>
                
                <div class="detalle-bloque">
                    <div class="detalle-item"><span class="detalle-label">Fecha y Hora</span>${formateaFecha(reg.fechaISO)}</div>
                    <hr style="border:0; border-top:1px solid #2c2c2e; margin:10px 0;">
                    <div class="detalle-item"><span class="detalle-label">Motivo</span><b>${reg.motivo}</b></div>
                    <hr style="border:0; border-top:1px solid #2c2c2e; margin:10px 0;">
                    <div class="detalle-item"><span class="detalle-label">Lugar de los hechos</span>${reg.lugar || 'No consta'}</div>
                </div>
                <div class="detalle-bloque">
                    <div class="detalle-item"><span class="detalle-label">Datos del Requirente</span></div>
                    <div class="detalle-item"><b>Tlf:</b> ${reg.telefono || 'No consta'}</div>
                    <div class="detalle-item"><b>Nombre:</b> ${reg.comunicante || 'No consta'}</div>
                </div>
                <div class="detalle-bloque">
                    <span class="detalle-label" style="margin-bottom: 8px;">Implicados / Identificados</span>
                    ${htmlImplicados}
                </div>
                <div class="detalle-bloque">
                    <span class="detalle-label">Observaciones y Desarrollo</span>
                    <div class="detalle-item" style="white-space: pre-wrap;">${reg.observaciones || 'Sin observaciones adicionales.'}</div>
                    ${reg.fotoObservaciones ? `<div style="margin-top:15px; text-align:center;"><img src="${reg.fotoObservaciones}" style="max-height:300px; max-width:100%; border-radius:8px;"></div>` : ''}
                </div>
                
                <div class="actuantes-box">
                    <div style="font-size: 12px; color: #8e8e93; text-transform: uppercase; margin-bottom: 5px;">Agentes Actuantes</div>
                    <div class="actuantes-line">${reg.actuantes || 'No consta'}</div>
                </div>
            `;
            document.getElementById('print-content').innerHTML = htmlDetalle;
            mostrar('details-screen');
        }
    </script>
</body>
</html>
